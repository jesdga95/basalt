<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basalt Community Runs</title>
<link rel="icon" href="mark.svg">
<style>
@font-face { font-family: "Geist"; font-weight: 100 900; font-display: swap; src: url(fonts/geist-latin-wght.woff2) format("woff2"); }
@font-face { font-family: "Geist Mono"; font-weight: 100 900; font-display: swap; src: url(fonts/geist-mono-latin-wght.woff2) format("woff2"); }
:root {
  --bg: #0E1114; --panel: #151A1F; --raised: #2A333C; --line: #28313A; --line-soft: #222A32;
  --fg: #E9ECEE; --fg-2: #9AA4AD; --fg-3: #77828C; --accent: #FF7A3D;
  --font-sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.5 var(--font-sans); }
main { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
header { display: flex; align-items: center; gap: 16px; padding: 40px 0 16px; }
header img { width: 80px; height: 80px; flex: none; }
header .names { display: flex; flex-direction: column; gap: 7px; }
.wordmark { font: 700 30px/1 var(--font-sans); letter-spacing: -.035em; }
.title { font: 500 15px/1 var(--font-sans); color: var(--fg-2); }

/* Page background: a faint honeycomb, strongest top right, with a hex cluster in that corner. */
.bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.bg .grid { position: absolute; inset: 0; width: 100%; height: 100%; color: #161C21;
  -webkit-mask-image: radial-gradient(ellipse 90% 80% at 100% 0%, #000 0%, rgba(0,0,0,.35) 55%, transparent 100%);
  mask-image: radial-gradient(ellipse 90% 80% at 100% 0%, #000 0%, rgba(0,0,0,.35) 55%, transparent 100%); }
.bg .cluster { position: absolute; top: -40px; right: -120px; width: 760px; height: 480px;
  -webkit-mask-image: linear-gradient(200deg, #000 30%, transparent 85%); mask-image: linear-gradient(200deg, #000 30%, transparent 85%); }
.bg .cluster .d { fill: #13181D; stroke: #1C232A; stroke-width: 1.5; }
.bg .cluster .m { fill: #171D23; stroke: #20282F; stroke-width: 1.5; }
.bg .cluster .f { fill: none; stroke: #1A2026; stroke-width: 1.5; }
.bg .cluster .e { fill: url(#ember); opacity: .5; }
.bg .ember { fill: #F2662B; opacity: .07; }
body { background: var(--bg); }
.wrap { background: var(--bg); }
p.lede { color: var(--fg-2); max-width: 72ch; margin: 8px 0 20px; }
p.lede code { font-family: var(--font-mono); color: var(--fg); background: var(--panel); padding: 1px 6px; border-radius: 4px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.controls input, .ms > button {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--fg);
  font: 400 13.5px/1 var(--font-mono); padding: 9px 12px; min-width: 0;
}
.controls input { flex: 1 1 220px; }
.controls input:focus, .ms > button:focus-visible { outline: none; border-color: var(--accent); }

/* Multi-select dropdown: a button and a checkbox list in a popover. */
.ms { position: relative; flex: 0 1 auto; }
.ms > button { display: flex; align-items: center; gap: 10px; cursor: pointer; white-space: nowrap; }
.ms > button::after { content: ""; width: 6px; height: 6px; border: solid var(--fg-3); border-width: 0 1.5px 1.5px 0; transform: translateY(-2px) rotate(45deg); transition: transform .15s; }
.ms[data-open] > button { border-color: var(--raised); }
.ms[data-open] > button::after { transform: translateY(1px) rotate(-135deg); }
.ms[data-active] > button { color: var(--accent); border-color: rgba(255, 122, 61, .45); }
.ms .pop {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 10; min-width: 100%; max-height: 300px; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--raised); border-radius: 8px; padding: 6px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
}
.ms:not([data-open]) .pop { display: none; }
.ms .pop.flip { left: auto; right: 0; }
.ms .opt {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 5px;
  font: 400 13.5px/1 var(--font-mono); color: var(--fg-2); white-space: nowrap; cursor: pointer; text-align: left;
  background: none; border: 0;
}
.ms .opt:hover, .ms .opt:focus-visible { background: var(--raised); color: var(--fg); outline: none; }
.ms .box { width: 14px; height: 14px; flex: none; display: grid; place-items: center; border: 1.5px solid var(--fg-3); border-radius: 3px; }
.ms .box svg { width: 10px; height: 10px; visibility: hidden; }
.ms .opt[aria-checked="true"] { color: var(--fg); }
.ms .opt[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
.ms .opt[aria-checked="true"] .box svg { visibility: visible; }
.ms .n { margin-left: auto; padding-left: 16px; color: var(--fg-3); font-size: 12px; }
.ms .clear { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border-top: 1px solid var(--line); border-radius: 0; color: var(--fg-3); font: 400 12.5px/1 var(--font-sans); text-align: left; cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.ms .clear:hover { color: var(--accent); }
.sort { display: flex; margin-left: auto; }
.sort .pop { max-height: none; }
.ms.single .opt .box { border-color: transparent; background: none; }
.ms.single .opt[aria-checked="true"] .box { background: none; border-color: transparent; }
.ms.single .box svg path { stroke: var(--accent); }
.ms.single .opt[aria-checked="true"] { color: var(--accent); }
.sort .ms > button { border-radius: 6px 0 0 6px; height: 100%; }
.sort > button { display: grid; place-items: center; width: 42px; padding: 0; background: var(--panel); border: 1px solid var(--line); border-left: 0; border-radius: 0 6px 6px 0; color: var(--accent); font: 400 15px/1 var(--font-mono); cursor: pointer; }
.sort > button:focus-visible { outline: none; border-color: var(--accent); }

/* Runs: one card per run. The header is the whole click target; the open card shows a memory bar and the run's details. */
:root { --t1: 12px; --t2: 15px; --t3: 24px; --seg1: #E9ECEE; --seg2: #B7BEC4; --seg3: #8A949C; --seg4: #5E6872; --segram: #2A333C; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ico { width: 16px; height: 16px; flex: none; display: block; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.run { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.run:hover { border-color: var(--raised); background: color-mix(in srgb, var(--panel), var(--fg) 3%); }
.run > button { display: grid; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; align-items: start;
  grid-template-columns: minmax(0, 1fr) 16px; grid-template-areas: "id chev" "stats stats"; gap: 18px 14px; padding: 20px 18px; border-radius: 14px; }
.run > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.id { grid-area: id; min-width: 0; }
.gpu { font: 600 var(--t3)/1.2 var(--font-sans); letter-spacing: -.01em; overflow-wrap: anywhere; }
.gpu .extra { color: var(--fg-3); font-weight: 500; }
.m2 { display: flex; align-items: center; gap: 12px; margin-top: 10px; min-width: 0; }
.pill { flex: 0 1 auto; min-width: 0; max-width: 160px; font: 500 var(--t1)/1 var(--font-mono); color: var(--fg-2); background: var(--raised); border-radius: 6px; padding: 6px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font: 400 var(--t1)/1.3 var(--font-mono); color: var(--fg-3); }
.sub .num { font-size: var(--t1); }
.stats { grid-area: stats; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.st { min-width: 0; }
.st .l { display: block; font: 400 var(--t1)/1.2 var(--font-sans); color: var(--fg-2); }
.st .v { display: block; margin-top: 8px; font: 500 var(--t3)/1.1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg); white-space: nowrap; }
.st .v.hi { color: var(--accent); }
.chev { grid-area: chev; width: 16px; height: 16px; margin-top: 6px; color: var(--fg-3); transform: rotate(90deg); transition: transform .15s, color .15s; }
.chev .ico { width: 100%; height: 100%; }
.run[data-open] .chev { transform: rotate(-90deg); }
.run:hover .chev { color: var(--fg); }
.run > button:focus-visible .chev { color: var(--accent); }
.detail { padding: 0 18px 20px; display: grid; gap: 18px; }
.segs, .labels { display: flex; gap: 4px; }
.seg { flex: var(--g) 1 0; min-width: 4px; height: 10px; border-radius: 5px; background: var(--c); }
.labels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 28px; margin-top: 16px; }
.lab { display: flex; align-items: center; gap: 10px; min-width: 0; white-space: nowrap; }
.lab i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.lab .tx { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; }
.lab .n { min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; font: 600 var(--t2)/1.3 var(--font-sans); color: var(--fg); }
.lab .s { flex: none; font: 400 var(--t1)/1.3 var(--font-mono); color: var(--fg-3); }
.hw { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 28px; margin: 0; }
.hw > div { min-width: 0; }
.hw dt { font: 400 var(--t1)/1.3 var(--font-sans); color: var(--fg-3); }
.hw dd { margin: 4px 0 0; font: 400 var(--t1)/1.4 var(--font-mono); color: var(--fg-2); overflow-wrap: anywhere; }
.foot { margin: 0; padding-top: 16px; border-top: 1px solid var(--line-soft); font: 400 var(--t2)/1.3 var(--font-sans); color: var(--fg); }
.foot .l { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: baseline; }
.foot .by { color: var(--fg-3); }
.foot .who { color: var(--fg); overflow-wrap: anywhere; }
.foot .dt { font: 400 var(--t1)/1.3 var(--font-mono); color: var(--fg-3); }
.foot .hash { font: 400 var(--t1)/1.3 var(--font-mono); color: var(--fg-2); text-decoration: underline; text-underline-offset: 3px; }
.clamp { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font: 400 var(--t2)/1.5 var(--font-sans); color: var(--fg-2); overflow-wrap: anywhere; white-space: pre-wrap; }
.clamp.full { display: block; }
.moretoggle { background: none; border: 0; padding: 4px 0 0; color: var(--accent); font: 500 var(--t1)/1 var(--font-sans); cursor: pointer; }
.moretoggle[hidden] { display: none; }
.moretoggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pager { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: center; margin: 20px 0 8px; }
.pager button { min-width: 40px; height: 40px; padding: 0 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--fg-2); font: 400 13.5px/1 var(--font-mono); cursor: pointer; }
.pager button:hover { color: var(--fg); border-color: var(--raised); }
.pager button:focus-visible { outline: none; border-color: var(--accent); }
.pager button[aria-current="page"], .pager button[aria-current="page"]:hover { color: var(--accent); border-color: rgba(255, 122, 61, .45); background: var(--bg); }
.pages { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; align-items: center; }
.pages[hidden], .sep[hidden] { display: none; }
.pages .gap { min-width: 20px; text-align: center; color: var(--fg-3); font: 400 13.5px/1 var(--font-mono); }
.sep { width: 1px; height: 24px; background: var(--line); }
.pager.wrapped .sep { display: none; }
.range { font: 400 13px/1.4 var(--font-mono); color: var(--fg-3); }
.empty { padding: 32px; text-align: center; color: var(--fg-3); }
@media (min-width: 760px) {
  .run > button { grid-template-columns: minmax(0, 1fr) auto 16px; grid-template-areas: "id stats chev"; gap: 24px; padding: 24px 28px; }
  .gpu { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; gap: 48px; }
  .st { min-width: 90px; }
  .chev { align-self: center; margin-top: 0; }
  .detail { padding: 0 28px 26px; }
}
@media (max-width: 559px) {
  .labels, .hw { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><svg class="grid"><defs><pattern id="hex" width="24.25" height="42" patternUnits="userSpaceOnUse"><g fill="none" stroke="currentColor" stroke-width="1"><polygon points="12.12,0 24.25,7 24.25,21 12.12,28 0,21 0,7"/><polygon points="0,21 12.12,28 12.12,42 0,49 -12.12,42 -12.12,28"/><polygon points="24.25,21 36.37,28 36.37,42 24.25,49 12.12,42 12.12,28"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#hex)"/><polygon class="ember" points="739.6,43.0 750.9,49.5 750.9,62.5 739.6,69.0 728.4,62.5 728.4,49.5"/><polygon class="ember" points="642.6,127.0 653.9,133.5 653.9,146.5 642.6,153.0 631.4,146.5 631.4,133.5"/><polygon class="ember" points="873.0,190.0 884.3,196.5 884.3,209.5 873.0,216.0 861.7,209.5 861.7,196.5"/><polygon class="ember" points="533.5,64.0 544.8,70.5 544.8,83.5 533.5,90.0 522.2,83.5 522.2,70.5"/><polygon class="ember" points="836.6,295.0 847.9,301.5 847.9,314.5 836.6,321.0 825.4,314.5 825.4,301.5"/><polygon class="ember" points="460.8,232.0 472.0,238.5 472.0,251.5 460.8,258.0 449.5,251.5 449.5,238.5"/><polygon class="ember" points="982.1,85.0 993.4,91.5 993.4,104.5 982.1,111.0 970.9,104.5 970.9,91.5"/><polygon class="ember" points="1079.1,253.0 1090.4,259.5 1090.4,272.5 1079.1,279.0 1067.9,272.5 1067.9,259.5"/></svg><svg class="cluster" viewBox="0 0 760 480" aria-hidden="true"><defs><linearGradient id="ember" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC566"/><stop offset=".55" stop-color="#F2662B"/><stop offset="1" stop-color="#C9461C"/></linearGradient></defs><polygon class="m" points="400.0,72.0 450.2,101.0 450.2,159.0 400.0,188.0 349.8,159.0 349.8,101.0"/><polygon class="d" points="507.4,72.0 557.6,101.0 557.6,159.0 507.4,188.0 457.2,159.0 457.2,101.0"/><polygon class="d" points="292.6,72.0 342.8,101.0 342.8,159.0 292.6,188.0 242.4,159.0 242.4,101.0"/><polygon class="d" points="453.7,165.0 503.9,194.0 503.9,252.0 453.7,281.0 403.5,252.0 403.5,194.0"/><polygon class="f" points="346.3,165.0 396.5,194.0 396.5,252.0 346.3,281.0 296.1,252.0 296.1,194.0"/><polygon class="m" points="561.1,165.0 611.3,194.0 611.3,252.0 561.1,281.0 510.9,252.0 510.9,194.0"/><polygon class="d" points="453.7,-21.0 503.9,8.0 503.9,66.0 453.7,95.0 403.5,66.0 403.5,8.0"/><polygon class="d" points="561.1,-21.0 611.3,8.0 611.3,66.0 561.1,95.0 510.9,66.0 510.9,8.0"/><polygon class="f" points="346.3,-21.0 396.5,8.0 396.5,66.0 346.3,95.0 296.1,66.0 296.1,8.0"/><polygon class="e" points="614.8,72.0 665.0,101.0 665.0,159.0 614.8,188.0 564.5,159.0 564.5,101.0"/><polygon class="d" points="668.5,165.0 718.7,194.0 718.7,252.0 668.5,281.0 618.2,252.0 618.2,194.0"/><polygon class="d" points="614.8,258.0 665.0,287.0 665.0,345.0 614.8,374.0 564.5,345.0 564.5,287.0"/><polygon class="f" points="507.4,258.0 557.6,287.0 557.6,345.0 507.4,374.0 457.2,345.0 457.2,287.0"/><polygon class="f" points="722.2,258.0 772.4,287.0 772.4,345.0 722.2,374.0 671.9,345.0 671.9,287.0"/><polygon class="d" points="722.2,72.0 772.4,101.0 772.4,159.0 722.2,188.0 671.9,159.0 671.9,101.0"/><polygon class="f" points="238.9,165.0 289.1,194.0 289.1,252.0 238.9,281.0 188.7,252.0 188.7,194.0"/><polygon class="f" points="185.2,72.0 235.5,101.0 235.5,159.0 185.2,188.0 135.0,159.0 135.0,101.0"/><polygon class="f" points="400.0,258.0 450.2,287.0 450.2,345.0 400.0,374.0 349.8,345.0 349.8,287.0"/></svg></div>
<main>
  <header>
    <img src="mark.svg" alt="">
    <div class="names">
      <span class="wordmark">Basalt</span>
      <span class="title">Community runs</span>
    </div>
  </header>
  <p class="lede">Performance submitted by users, all from the same preset (<code id="preset">basalt-bench --community</code>).</p>


  <div class="controls">
    <input id="q" type="search" placeholder="Search GPU, quant, submitter…" aria-label="Search">
    <div class="ms" id="f-gpu"></div>
    <div class="ms" id="f-n"></div>
    <div class="ms" id="f-quant"></div>
    <div class="ms" id="f-os"></div>
    <div class="sort"><div class="ms" id="f-sort"></div><button id="sortdir" type="button"></button></div>
  </div>

  <ul class="list" id="rows"></ul>
  <nav class="pager" id="pager" aria-label="Pages"><div class="pages" id="pages"></div><span class="sep" id="sep" aria-hidden="true"></span><span class="range" id="range"></span></nav>
</main>
<script>
const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const SVGNS = "http://www.w3.org/2000/svg";
const ICONS = { chev: [["path", { d: "M9 6l6 6-6 6" }]] };
function icon(name, cls) {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); s.setAttribute("class", cls || "ico");
  s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "1.7");
  s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
  for (const [t, a] of ICONS[name]) { const p = document.createElementNS(SVGNS, t); for (const [k, v] of Object.entries(a)) p.setAttribute(k, v); s.append(p); }
  return s;
}
function checkIcon() {
  const s = document.createElementNS(SVGNS, "svg"); s.setAttribute("viewBox", "0 0 10 10"); s.setAttribute("aria-hidden", "true");
  const p = document.createElementNS(SVGNS, "path");
  for (const [k, v] of Object.entries({ d: "M1.5 5.2 4 7.6 8.5 2.6", fill: "none", stroke: "#0E1114", "stroke-width": "1.8", "stroke-linecap": "round", "stroke-linejoin": "round" })) p.setAttribute(k, v);
  s.append(p); return s;
}
// Build children from parts: a plain string is words, [string] is a number or hash set in mono.
function rich(parent, parts) {
  parts.forEach(p => parent.append(Array.isArray(p) ? el("span", "num", p[0]) : document.createTextNode(p)));
  return parent;
}
const f0 = v => Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 });
const f1 = v => Number(v).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const shortName = n => String(n).replace(/\b(NVIDIA|GeForce|Workstation Edition|Server Edition|Max-Q)\b/g, "").replace(/\s+/g, " ").trim();
const trunc = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s; };
function whoEl(name) { const s = el("span", "who", trunc(name, 24)); s.title = name; return s; }

let runs = [], page = 1;
const PER = 20;
let sort = { key: "decode_tps", dir: -1 };
const open = new Set();
const SORTS = [
  { key: "decode_tps", label: "Decode tok/s", num: true },
  { key: "prefill_16k_tps", label: "Prefill 16K", num: true },
  { key: "prefill_64k_tps", label: "Prefill 64K", num: true },
  { key: "_vram", label: "Total VRAM", num: true },
  { key: "_power", label: "Total power", num: true },
  { key: "ram_gib", label: "RAM", num: true },
  { key: "_rig", label: "GPUs" },
  { key: "quant", label: "Quant" },
  { key: "os", label: "System" },
  { key: "date", label: "Date" },
  { key: "submitter", label: "Submitter" },
];
const SEARCH = ["_rig", "cpu", "quant", "os", "submitter", "commit", "date", "preset", "notes"];

const filters = {};
function multiSelect(id, all, options) {
  const root = $(id), picked = new Set();
  filters[id] = picked;
  root.replaceChildren();
  const btn = el("button"); btn.type = "button"; btn.setAttribute("aria-haspopup", "true"); btn.setAttribute("aria-expanded", "false");
  const pop = el("div", "pop"); pop.setAttribute("role", "menu");
  options.forEach(o => {
    const b = el("button", "opt"); b.type = "button"; b.setAttribute("role", "menuitemcheckbox"); b.setAttribute("aria-checked", "false"); b.dataset.v = o.value;
    const box = el("span", "box"); box.append(checkIcon());
    b.append(box, document.createTextNode(o.label), el("span", "n", String(o.count)));
    pop.append(b);
  });
  const clr = el("button", "clear", "Clear"); clr.type = "button"; pop.append(clr);
  root.append(btn, pop);
  const label = () => {
    const sel = options.filter(o => picked.has(o.value));
    btn.textContent = !sel.length ? all : sel.length === 1 ? sel[0].label : `${sel.length} selected · ${all.replace(/^All |^Any /, "")}`;
    sel.length ? root.setAttribute("data-active", "") : root.removeAttribute("data-active");
  };
  const setOpen = on => {
    document.querySelectorAll(".ms[data-open]").forEach(m => { if (m !== root) { m.removeAttribute("data-open"); m.firstElementChild.setAttribute("aria-expanded", "false"); } });
    on ? root.setAttribute("data-open", "") : root.removeAttribute("data-open");
    btn.setAttribute("aria-expanded", String(on));
    if (on) placePop(root);
  };
  btn.addEventListener("click", () => { const on = !root.hasAttribute("data-open"); setOpen(on); if (on) root.querySelector(".opt")?.focus(); });
  pop.addEventListener("click", e => {
    const opt = e.target.closest(".opt");
    if (opt) {
      const v = opt.dataset.v;
      picked.has(v) ? picked.delete(v) : picked.add(v);
      opt.setAttribute("aria-checked", String(picked.has(v)));
    } else if (e.target.closest(".clear")) {
      picked.clear();
      root.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-checked", "false"));
    } else return;
    label(); render();
  });
  root.addEventListener("keydown", e => {
    const opts = [...root.querySelectorAll(".opt, .clear")], k = opts.indexOf(document.activeElement);
    if (e.key === "Escape") { setOpen(false); btn.focus(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!root.hasAttribute("data-open")) { setOpen(true); opts[0]?.focus(); return; }
      opts[(k + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length]?.focus();
    }
  });
  label();
}
document.addEventListener("click", e => {
  if (!e.target.closest(".ms")) document.querySelectorAll(".ms[data-open]").forEach(m => { m.removeAttribute("data-open"); m.firstElementChild.setAttribute("aria-expanded", "false"); });
});
// Single-select: the same component, one choice. Picking closes the panel and returns focus to the button.
function singleSelect(id, options, initial, onPick) {
  const root = $(id);
  root.classList.add("single");
  let value = initial;
  root.replaceChildren();
  const btn = el("button"); btn.type = "button"; btn.setAttribute("aria-haspopup", "true"); btn.setAttribute("aria-expanded", "false");
  const pop = el("div", "pop"); pop.setAttribute("role", "menu");
  options.forEach(o => {
    const b = el("button", "opt"); b.type = "button"; b.setAttribute("role", "menuitemradio"); b.setAttribute("aria-checked", "false"); b.dataset.v = o.value;
    const box = el("span", "box"); box.append(checkIcon());
    b.append(box, document.createTextNode(o.label));
    pop.append(b);
  });
  root.append(btn, pop);
  const sync = () => {
    pop.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-checked", String(o.dataset.v === value)));
    btn.textContent = options.find(o => o.value === value).label;
  };
  const setOpen = on => {
    document.querySelectorAll(".ms[data-open]").forEach(m => { if (m !== root) { m.removeAttribute("data-open"); m.firstElementChild.setAttribute("aria-expanded", "false"); } });
    on ? root.setAttribute("data-open", "") : root.removeAttribute("data-open");
    btn.setAttribute("aria-expanded", String(on));
    if (on) placePop(root);
  };
  btn.addEventListener("click", () => {
    const on = !root.hasAttribute("data-open");
    setOpen(on);
    if (on) (pop.querySelector('.opt[aria-checked="true"]') || pop.querySelector(".opt"))?.focus();
  });
  pop.addEventListener("click", e => {
    const opt = e.target.closest(".opt"); if (!opt) return;
    value = opt.dataset.v; sync(); setOpen(false); btn.focus(); onPick(value);
  });
  root.addEventListener("keydown", e => {
    const opts = [...root.querySelectorAll(".opt")], k = opts.indexOf(document.activeElement);
    if (e.key === "Escape") { setOpen(false); btn.focus(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!root.hasAttribute("data-open")) { setOpen(true); (pop.querySelector('.opt[aria-checked="true"]') || opts[0])?.focus(); return; }
      opts[(k + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length]?.focus();
    }
  });
  sync();
  return { set(v) { value = v; sync(); } };
}
// A panel that would run past the right edge opens right-aligned instead, so the page never scrolls sideways.
function placePop(root) {
  const pop = root.querySelector(".pop");
  pop.classList.remove("flip");
  if (pop.getBoundingClientRect().right > document.documentElement.clientWidth - 8) pop.classList.add("flip");
}
function countBy(values) {
  const m = new Map();
  values.forEach(v => m.set(v, (m.get(v) || 0) + 1));
  return [...m].sort((a, b) => String(a[0]).localeCompare(String(b[0]))).map(([value, count]) => ({ value, label: value, count }));
}
const any = (id, test) => !filters[id]?.size || [...filters[id]].some(test);

// _rig is the full label (search, sort, title); _main and _extra are the shortened header name and its "+ N".
function rig(r, i) {
  const g = r.gpus || [];
  const group = names => {
    const counts = new Map();
    names.forEach(n => counts.set(n, (counts.get(n) || 0) + 1));
    return [...counts].map(([n, k]) => (k > 1 ? k + "× " : "") + n);
  };
  const full = group(g.map(x => x.name)), short = group(g.map(x => shortName(x.name)));
  r._id = i;
  r._rig = full.join(" + ");
  r._main = short.length > 2 ? short[0] : short.join(" + ");
  r._extra = short.length > 2 ? g.length - 1 : 0;
  r._names = g.map(x => x.name);
  r._n = g.length;
  r._vram = g.reduce((s, x) => s + (x.vram_gib || 0), 0);
  r._power = g.reduce((s, x) => s + (x.power_w || 0), 0);
  return r;
}

function quantPill(r, cls) { const p = el("span", "pill " + (cls || ""), r.quant); p.title = r.quant; return p; }

// Notes: clamped to two lines; the toggle appears only when the text overflows.
function notesBlock(text) {
  const w = el("div", "notes");
  const p = el("p", "clamp", text);
  const b = el("button", "moretoggle", "More"); b.type = "button"; b.hidden = true; b.setAttribute("aria-expanded", "false");
  b.addEventListener("click", e => { e.stopPropagation(); const on = p.classList.toggle("full"); b.textContent = on ? "Less" : "More"; b.setAttribute("aria-expanded", String(on)); });
  w.append(p, b); return w;
}
function wireNotes(root) {
  root.querySelectorAll(".notes").forEach(w => {
    const p = w.querySelector(".clamp"), b = w.querySelector(".moretoggle");
    if (p.classList.contains("full")) return;
    b.hidden = p.scrollHeight <= p.clientHeight + 1;
  });
}

function row(r) {
  const isOpen = open.has(r._id);
  const li = el("li", "run"); if (isOpen) li.setAttribute("data-open", "");
  const b = el("button"); b.type = "button"; b.dataset.id = r._id; b.setAttribute("aria-expanded", String(isOpen)); b.setAttribute("aria-controls", "d" + r._id);
  b.append(...buildHead(r));
  li.append(b);
  if (isOpen) li.append(buildDetail(r));
  return li;
}

function render(keepPage) {
  if (!keepPage) page = 1;
  const q = $("q").value.trim().toLowerCase();
  const shown = runs.filter(r =>
    any("f-gpu", v => r._names.includes(v)) && any("f-n", v => v === String(Math.min(r._n, 3))) &&
    any("f-quant", v => r.quant === v) && any("f-os", v => r.os === v) &&
    (!q || SEARCH.some(k => String(r[k] ?? "").toLowerCase().includes(q))));
  shown.sort((a, b) => {
    const x = a[sort.key], y = b[sort.key];
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * sort.dir;
  });
  const pages = Math.max(1, Math.ceil(shown.length / PER));
  page = Math.min(page, pages);
  const from = (page - 1) * PER, slice = shown.slice(from, from + PER);
  const list = $("rows");
  list.replaceChildren();
  if (slice.length) slice.forEach(r => list.append(row(r)));
  else list.append(el("li", "empty", runs.length ? "No runs match." : "No runs yet. Be the first: see below."));
  wireNotes(list);
  drawPager(pages);
  const total = runs.length;
  $("range").textContent = !shown.length ? "0 of " + total + " runs"
    : (pages > 1 ? `${from + 1}\u2013${from + slice.length} of ${shown.length} runs` : shown.length + (shown.length === 1 ? " run" : " runs")) + (shown.length < total ? ` (${total} in total)` : "");
}

function pageItems(pages) {
  const set = new Set([1, pages, page - 1, page, page + 1]);
  const nums = [...set].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b);
  const out = [];
  nums.forEach((n, i) => { if (i && n - nums[i - 1] > 1) out.push(n - nums[i - 1] === 2 ? n - 1 : 0); out.push(n); });
  return out;
}
function drawPager(pages) {
  const wrap = $("pages");
  wrap.replaceChildren();
  wrap.hidden = $("sep").hidden = pages <= 1;
  if (pages > 1) pageItems(pages).forEach(n => {
    if (!n) { wrap.append(el("span", "gap", "\u2026")); return; }
    const b = el("button", null, String(n)); b.type = "button"; b.setAttribute("aria-label", "Page " + n);
    if (n === page) b.setAttribute("aria-current", "page");
    b.addEventListener("click", () => { page = n; render(true); requestAnimationFrame(toToolbar); });
    wrap.append(b);
  });
  wirePager();
}
// After a page change, jump so the toolbar sits just under the top edge; an instant jump cannot be cut short by the new page's height.
function toToolbar() {
  const top = document.querySelector(".controls").getBoundingClientRect().top + window.scrollY - 12;
  window.scrollTo({ top: Math.max(0, top), left: 0, behavior: "instant" });
}
// When the range text wraps under the numbers, the divider is dropped.
function wirePager() {
  const nav = $("pager");
  nav.classList.remove("wrapped");
  if (!$("pages").hidden && $("range").getBoundingClientRect().top >= $("pages").getBoundingClientRect().bottom - 2) nav.classList.add("wrapped");
}
window.addEventListener("resize", wirePager);

function setupSort() {
  const dir = $("sortdir");
  const arrow = () => { dir.textContent = sort.dir > 0 ? "\u2191" : "\u2193"; dir.setAttribute("aria-label", sort.dir > 0 ? "Ascending" : "Descending"); };
  singleSelect("f-sort", SORTS.map(s => ({ value: s.key, label: s.label })), sort.key, key => {
    const s = SORTS.find(x => x.key === key); sort = { key: s.key, dir: s.num ? -1 : 1 }; arrow(); render();
  });
  dir.addEventListener("click", () => { sort.dir = -sort.dir; arrow(); render(); });
  arrow();
}

$("rows").addEventListener("click", e => {
  const b = e.target.closest(".run > button"); if (!b) return;
  const id = +b.dataset.id;
  open.has(id) ? open.delete(id) : open.add(id);
  const li = b.parentElement, on = open.has(id);
  b.setAttribute("aria-expanded", String(on));
  on ? li.setAttribute("data-open", "") : li.removeAttribute("data-open");
  if (on) { li.append(buildDetail(runs[id])); wireNotes(li); } else li.querySelector(".detail")?.remove();
});
$("q").addEventListener("input", render);
window.addEventListener("resize", () => wireNotes($("rows")));

fetch("benchmarks.json").then(r => r.json()).then(data => {
  runs = (data.runs || []).map((r, i) => rig(r, i));
  if (data.preset) $("preset").textContent = data.preset;
  multiSelect("f-gpu", "All GPUs", countBy(runs.flatMap(r => [...new Set(r._names)])));
  multiSelect("f-n", "Any GPU count", countBy(runs.map(r => String(Math.min(r._n, 3))))
    .map(o => ({ ...o, label: o.value === "1" ? "1 GPU" : o.value === "3" ? "3+ GPUs" : o.value + " GPUs" })));
  multiSelect("f-quant", "All quants", countBy(runs.map(r => r.quant)));
  multiSelect("f-os", "All systems", countBy(runs.map(r => r.os)));
  setupSort(); render();
}).catch(() => { $("rows").replaceChildren(el("li", "empty", "Could not load benchmarks.json.")); });
const SEGCOL = ["var(--seg1)", "var(--seg2)", "var(--seg3)", "var(--seg4)"];
function st(label, v, hi) { const s = el("div", "st"); s.append(el("span", "l", label), el("span", "v" + (hi ? " hi" : ""), v)); return s; }
function buildHead(r) {
  const id = el("div", "id");
  const gpu = el("div", "gpu", r._main); gpu.title = r._rig;
  if (r._extra) gpu.append(document.createTextNode(" "), el("span", "extra", "+ " + r._extra));
  const m = el("div", "m2");
  const sub = el("span", "sub");
  rich(sub, [...(r._n > 1 ? [r._n + " GPUs · "] : []), [f0(r._vram) + " GiB"], " · ", [f0(r._power) + " W"]]);
  m.append(quantPill(r), sub);
  id.append(gpu, m);
  const stats = el("div", "stats");
  stats.append(st("Prefill 16K", f0(r.prefill_16k_tps)), st("Prefill 64K", f0(r.prefill_64k_tps)), st("Decode tok/s", f1(r.decode_tps), true));
  const chev = el("span", "chev"); chev.append(icon("chev", "ico"));
  return [id, stats, chev];
}
function buildDetail(r) {
  const d = el("div", "detail"); d.id = "d" + r._id;
  const segsData = r.gpus.map((x, k) => ({ name: x.name, sub: x.vram_gib + " GiB · " + x.power_w + " W", gib: x.vram_gib, c: SEGCOL[Math.min(k, 3)] }));
  if (r.ram_gib != null) segsData.push({ name: "System RAM", sub: r.ram_gib + " GiB", gib: r.ram_gib, c: "var(--segram)" });
  const bars = el("div", "bars"); bars.setAttribute("role", "img");
  bars.setAttribute("aria-label", segsData.map(s => s.name + " " + s.sub).join(", "));
  const segs = el("div", "segs"), labels = el("div", "labels");
  segsData.forEach(s => {
    const seg = el("span", "seg"); seg.style.setProperty("--g", s.gib); seg.style.setProperty("--c", s.c); seg.title = s.name + ", " + s.sub;
    const lab = el("div", "lab"); lab.style.setProperty("--g", s.gib); lab.style.setProperty("--c", s.c);
    const tx = el("div", "tx"); const nm = el("span", "n", s.name); nm.title = s.name; tx.append(nm, el("span", "s", s.sub)); lab.append(el("i"), tx);
    segs.append(seg); labels.append(lab);
  });
  bars.append(segs, labels);
  d.append(bars);
  const hw = [];
  if (r.cpu) hw.push(["CPU", r.cpu]);
  if (r.ram_gbps != null) hw.push(["RAM read", f1(r.ram_gbps) + " GB/s"]);
  r.gpus.forEach(x => {
    const v = [x.pcie ? "PCIe " + x.pcie : "", x.h2d_gbps != null ? f1(x.h2d_gbps) + " GB/s to GPU" : ""].filter(Boolean).join(" · ");
    if (v) hw.push([shortName(x.name), v]);
  });
  if (hw.length) {
    const dl = el("dl", "hw");
    hw.forEach(([k, v]) => { const c = el("div"); c.append(el("dt", null, k), el("dd", null, v)); dl.append(c); });
    d.append(dl);
  }
  const f = el("p", "foot");
  const l = el("span", "l");
  if (r.os) l.append(el("span", null, r.os));
  const by = el("span", "by"); by.append(document.createTextNode("by "), Object.assign(whoEl(r.submitter), { className: "who" }));
  l.append(by, el("span", "dt", r.date), el("span", "hash", r.commit));
  f.append(l);
  d.append(f);
  if (r.notes) d.append(notesBlock(r.notes));
  return d;
}
