<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basalt</title>
<link rel="icon" href="web/favicon.svg" type="image/svg+xml">
<link rel="icon" href="web/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="web/apple-touch-icon.png" sizes="180x180">
<link rel="preload" href="fonts/geist-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/geist-mono-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="web/app.css">
<script defer src="web/app.js"></script>
</head>
<body>

<header class="top">
  <div class="brand"><img src="web/mark.svg" alt=""><span class="wordmark">Basalt</span></div>
  <div class="crumb">
    <span class="crumb-sep" aria-hidden="true">/</span>
    <span class="model" id="model"></span>
    <div class="ms" id="models" hidden></div>
    <button type="button" class="unload" id="unload" hidden>Unload</button>
  </div>
  <span class="grow"></span>
  <span class="sp">
    <span class="lab"><span class="state" id="state" data-s="offline">Connecting</span><span class="state" id="pct" data-s="loading" hidden></span></span>
    <span class="pbar" id="pbar" hidden><i></i></span>
  </span>
  <span class="where" id="host"></span>
  <span class="where" id="keyed" hidden>API key</span>
</header>

<form class="auth" id="auth" hidden>
  <label for="key">API key</label>
  <input id="key" type="password" autocomplete="off" placeholder="Required by this server">
  <button>Connect</button>
</form>

<main>
  <!-- decode, prefill and where the experts are; with no model, the screen saver -->
  <section class="hero" aria-label="Speed and where the experts live">
    <div class="col dec">
      <div class="hd"><div class="k" id="dec-k">Decode</div><div class="v big" id="dec-v">-</div><div class="sub" id="dec-sub"></div></div>
      <div class="ch big" id="dec-chart"></div>
    </div>
    <div class="col pc">
      <div class="hd"><div class="k" id="pre-k">Prefill</div><div class="v mid" id="pre-v">-</div><div class="sub" id="pre-sub"></div></div>
      <div class="ch big" id="pre-chart"></div>
    </div>
    <div class="none" id="none" hidden></div>
    <div class="col exp">
      <div class="k" id="exp-h">Experts</div>
      <div class="leg" id="exp-leg"></div>
      <div class="map" id="exp-map"></div>
      <div class="key" id="exp-key"></div>
    </div>
  </section>

  <!-- everything else: a panel of fixed height under the hero; tables and the log scroll inside it -->
  <section class="panel" aria-label="Details">
    <nav class="tabs" aria-label="Details">
      <div id="tabs" role="tablist"></div>
      <span class="grow"></span>
      <div class="tog" id="lfilter" role="group" aria-label="Log level" hidden>
        <button type="button" data-f="all" aria-pressed="true">All</button><span aria-hidden="true">·</span><button type="button" data-f="warn" aria-pressed="false">Warnings</button>
      </div>
      <button type="button" class="jump" id="jump" hidden>Jump to latest</button>
    </nav>
    <div class="body">
      <section class="pane" id="p-req" role="tabpanel" hidden></section>
      <section class="pane" id="p-slots" role="tabpanel" hidden></section>
      <section class="pane" id="p-hw" role="tabpanel" hidden></section>
      <section class="pane logs" id="p-logs" role="tabpanel" hidden><div id="log" role="log" aria-live="off" tabindex="0"></div></section>
    </div>
  </section>
</main>

<!-- always on screen: the newest log line (opens Logs) and the session totals -->
<footer class="tail">
  <button type="button" class="ticker" id="ticker" title="Open the logs (L)"><span id="ticker-t"></span></button>
  <button type="button" class="tot" id="totals" title="Pricing and totals"></button>
  <button type="button" class="heart" id="support" title="Support Basalt" aria-label="Support Basalt"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 14s-5.5-3.4-5.5-7.4A3 3 0 0 1 8 4.6a3 3 0 0 1 5.5 2c0 4-5.5 7.4-5.5 7.4z" fill="currentColor"/></svg></button>
</footer>

</body>
</html>
