name: ci

# Pull requests run the same jobs as main. Fork pull requests get a read-only token and no secrets (none are used).
# No GPU is available: the engine is compiled for sm_120 and only the `cpu`-labelled tests run.
on:
  pull_request:
    paths-ignore:
      - "docs/community/**"
      - "tools/check_benchmarks.py"
      - ".github/workflows/community.yml"
  push:
    branches: [main]
    paths-ignore:
      - "docs/community/**"
      - "tools/check_benchmarks.py"
      - ".github/workflows/community.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"   # keeps the compiler caches from expiring

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CUDA_VERSION: "13.0.2"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Platform boundary
        run: tools/check_platform_boundary.sh
      - name: Engine log lines
        run: tools/check_stderr_logging.sh
      - name: Build structure
        run: tools/check_cu_includes.sh
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-test.txt pytest
      - name: Server tests
        run: python -m pytest serve/tests -q
      - name: Tool tests
        run: python -m pytest tools/test_bench_flags.py tools/test_bench_fixtures.py tools/test_serve_launcher.py tools/test_tokenizer.py -q
      - name: Converter tests
        run: python -m unittest discover -s tools/convert -p "test_*.py"
      - name: Migration tests
        run: python -m unittest discover -s tools/migrations -p "test_*.py"

  build-test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/toolchain
        with:
          cuda-version: ${{ env.CUDA_VERSION }}
          cache-key: ${{ matrix.os }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure
        env:
          WERROR: ${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWERROR="$WERROR"
          -DBUILD_TESTING=ON
          -DCMAKE_CUDA_ARCHITECTURES=120
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
          -DPython3_EXECUTABLE="$(python -c 'import sys;print(sys.executable.replace(chr(92),"/"))')"

      - name: Build
        run: cmake --build build -j "$(nproc)" -- -k 0

      - name: Every test carries a cpu or gpu label
        run: |
          export LC_ALL=C
          names() { sed -n 's/^  Test *#[0-9]*: //p' | sort -u; }
          ctest --test-dir build -N | names > all.txt
          ctest --test-dir build -N -L cpu | names > cpu.txt
          ctest --test-dir build -N -L gpu | names > gpu.txt
          echo "total=$(wc -l < all.txt) cpu=$(wc -l < cpu.txt) gpu=$(wc -l < gpu.txt)"
          # a fixture setup test is pulled into a label set by the tests that need it, so the union is what counts
          sort -u cpu.txt gpu.txt > labelled.txt
          if [ -n "$(comm -23 all.txt labelled.txt)" ]; then
            echo "tests with no cpu or gpu label (register them with basalt_cpu_test or basalt_gpu_test):" >&2
            comm -23 all.txt labelled.txt >&2
            exit 1
          fi

      - name: AVX-512 stays inside the dispatched kernels
        run: python tools/check_isa_isolation.py build

      - name: CPU tests
        run: |
          mkdir -p build/tmp
          export TEMP="$PWD/build/tmp" TMP="$PWD/build/tmp" TMPDIR="$PWD/build/tmp"
          ctest --test-dir build -L cpu -LE avx512 -j 4 --output-on-failure --timeout 300

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.os }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore
