name: ci

# Pull requests run the same jobs as main. Changes that only touch docs/ or Markdown files skip CI (community.yml checks the community rows). A pull
# request that changes no native code (only the Python server, Python tools, requirements or Markdown) runs lint alone: the builds need a
# C++/CUDA/CMake file, a test, a tool a CPU test runs, or the CI files themselves. Fork pull requests get a read-only token and no secrets (none are used).
# No GPU is available: the engine is compiled for sm_120 and only the `cpu`-labelled tests run.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "tools/check_benchmarks.py"
      - ".github/workflows/community.yml"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "tools/check_benchmarks.py"
      - ".github/workflows/community.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"   # keeps the compiler caches from expiring

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CUDA_VERSION: "13.0.2"

jobs:
  # native=true when the builds must run: always outside pull requests, else when a changed file is not one of the Python-only paths below
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.files.outputs.native }}
      models: ${{ steps.files.outputs.models }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The models come from cmake/models.cmake, so a new model needs no edit here.
          builtin=$(sed -n 's/^set(BASALT_BUILTIN_MODELS \(.*\))$/\1/p' cmake/models.cmake)
          [ -n "$builtin" ] || { echo "no BASALT_BUILTIN_MODELS in cmake/models.cmake" >&2; exit 1; }
          to_json() { python3 -c 'import json,sys; print(json.dumps(sorted(set(sys.argv[1:]))))' "$@"; }
          all_models=$(to_json $builtin)
          if [ "$EVENT" != pull_request ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "models=$all_models" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          native=false
          shared_native=false
          touched_models=""
          while IFS= read -r f; do
            case "$f" in
              tools/tokenizer.py|tools/check_benchmarks.py|tools/iq_fixture.py)
                native=true; shared_native=true; continue ;;   # CPU tests run these
              serve/*|tools/*.py|tools/convert/*|tools/migrations/*|requirements*.txt|*.md|docs/*) continue ;;
              .github/workflows/review.yml|.github/workflows/community*.yml|.github/workflows/pr-labels.yml) continue ;;
            esac
            native=true
            owner=""
            for m in $builtin; do
              case "$f" in
                src/models/$m/*|include/basalt/models/$m/*|tests/models/$m/*|tests/data/$m/*|data/bench/$m/*) owner=$m ;;
              esac
            done
            if [ -n "$owner" ]; then touched_models="$touched_models $owner"; else shared_native=true; fi
          done < <(git diff --no-renames --name-only "$BASE...$HEAD")
          if [ "$native" = false ]; then
            models='[]'
          elif [ "$shared_native" = true ] || [ -z "$touched_models" ]; then
            models="$all_models"
          else
            models=$(to_json $touched_models)
          fi
          echo "native=$native" | tee -a "$GITHUB_OUTPUT"
          echo "models=$models" | tee -a "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Platform boundary
        run: tools/check_platform_boundary.sh
      - name: Engine log lines
        run: tools/check_stderr_logging.sh
      - name: Build structure
        run: tools/check_cu_includes.sh
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-test.txt pytest pytest-xdist
      - name: Server tests
        run: python -m pytest serve/tests -n auto -q
      - name: Tool tests
        run: python -m pytest tools/test_bench_flags.py tools/test_bench_fixtures.py tools/test_serve_launcher.py tools/test_tokenizer.py tools/test_community_gate.py tools/test_community_sync.py tools/test_llm_review.py -q
      - name: Converter tests
        run: python -m unittest discover -s tools/convert -p "test_*.py"
      - name: Migration tests
        run: python -m unittest discover -s tools/migrations -p "test_*.py"

  build-test:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022]   # the Arm64 build is the DGX Spark's (12.1, NEON)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/toolchain
        with:
          cuda-version: ${{ env.CUDA_VERSION }}
          cache-key: ${{ matrix.os }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure
        env:
          WERROR: ${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWERROR="$WERROR"
          -DBASALT_MODELS=all
          -DBUILD_TESTING=ON
          -DCMAKE_CUDA_ARCHITECTURES=${{ runner.arch == 'ARM64' && '121' || '120' }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
          -DPython3_EXECUTABLE="$(python -c 'import sys;print(sys.executable.replace(chr(92),"/"))')"

      - name: Build
        run: cmake --build build -j "$(nproc)" -- -k 0

      - name: Every test carries a cpu or gpu label
        run: |
          export LC_ALL=C
          names() { sed -n 's/^  Test *#[0-9]*: //p' | sort -u; }
          ctest --test-dir build -N | names > all.txt
          ctest --test-dir build -N -L cpu | names > cpu.txt
          ctest --test-dir build -N -L gpu | names > gpu.txt
          echo "total=$(wc -l < all.txt) cpu=$(wc -l < cpu.txt) gpu=$(wc -l < gpu.txt)"
          # a fixture setup test is pulled into a label set by the tests that need it, so the union is what counts
          sort -u cpu.txt gpu.txt > labelled.txt
          if [ -n "$(comm -23 all.txt labelled.txt)" ]; then
            echo "tests with no cpu or gpu label (register them with basalt_cpu_test or basalt_gpu_test):" >&2
            comm -23 all.txt labelled.txt >&2
            exit 1
          fi

      - name: AVX-512 stays inside the dispatched kernels
        if: runner.arch == 'X64'
        run: python tools/check_isa_isolation.py build

      - name: CPU tests
        run: |
          mkdir -p build/tmp
          export TEMP="$PWD/build/tmp" TMP="$PWD/build/tmp" TMPDIR="$PWD/build/tmp"
          ctest --test-dir build -L cpu -LE avx512 -j 4 --output-on-failure --timeout 300

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.os }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  # A build of one model compiles and tests none of the others (-DBASALT_MODELS).
  build-single-model:
    needs: changes
    if: needs.changes.outputs.native == 'true' && needs.changes.outputs.models != '[]'
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.changes.outputs.models) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/toolchain
        with:
          cuda-version: ${{ env.CUDA_VERSION }}
          # its own cache under another prefix: a one-model build holds a subset of the objects, and a full build restores by the ubuntu-24.04- prefix
          cache-key: single-${{ matrix.model }}-ubuntu-24.04

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWERROR=ON
          -DBUILD_TESTING=ON
          -DBASALT_MODELS=${{ matrix.model }}
          -DCMAKE_CUDA_ARCHITECTURES=120
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j "$(nproc)" -- -k 0

      - name: CPU tests
        run: |
          mkdir -p build/tmp
          export TEMP="$PWD/build/tmp" TMP="$PWD/build/tmp" TMPDIR="$PWD/build/tmp"
          ctest --test-dir build -L cpu -LE avx512 -j 4 --output-on-failure --timeout 300
