name: release

# A published release gets one archive per platform, built from the release's tag and attached to it.
# workflow_dispatch rebuilds the archives of an existing release (`tag` is its tag, e.g. v0.3.1).
# Releases made with the workflow's own GITHUB_TOKEN do not start workflows; create them with a user token (`gh release`).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach to (v0.3.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CUDA_VERSION: "13.0.2"
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # the same toolchain and cache keys as ci.yml, so a release build starts from main's compiler cache
      - uses: ./.github/actions/toolchain
        with:
          cuda-version: ${{ env.CUDA_VERSION }}
          cache-key: ${{ matrix.os }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DCMAKE_CUDA_ARCHITECTURES=120
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Package
        run: python tools/package_release.py --tag "$TAG" --platform "${{ matrix.platform }}" --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
