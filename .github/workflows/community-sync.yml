name: community sync

# Mirrors the community run files into the Cloudflare D1 table the landing page reads. Every run rebuilds the table from
# the files on main: no diff, so no drift. See tools/community_sync.py for how readers never see a half-filled table.
on:
  push:
    branches: [main]
    paths:
      - "docs/community/runs/**"
      - "docs/community/preset.json"
  workflow_dispatch:

permissions:
  contents: read

# One rebuild at a time; a push that arrives meanwhile waits and then rebuilds from the newest main.
concurrency:
  group: community-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Rebuild the D1 table
        env:
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMUNITY_D1_ID: ${{ vars.COMMUNITY_D1_ID }}
        run: python3 tools/community_sync.py docs/community
