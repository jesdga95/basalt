[package]
name = "basalt-thread-api"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
basalt-thread-store = { path = "../basalt-thread-store" }
basalt-thread-runtime = { path = "../basalt-thread-runtime" }
basalt-context-registry = { path = "../basalt-context-registry" }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde", "v4"] }
